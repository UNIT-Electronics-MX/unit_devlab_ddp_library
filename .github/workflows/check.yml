name: Check DDP protocol

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout DDP library
        uses: actions/checkout@v4

      - name: Check shared protocol headers and device IDs
        run: make check
